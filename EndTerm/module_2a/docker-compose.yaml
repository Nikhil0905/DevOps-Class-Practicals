services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppass" ]
      interval: 5s
      timeout: 3s
      retries: 4

  backend:
    image: node:18
    command: bash -c "echo 'Connecting to the Backend....' && sleep 2 && echo 'Backend Container Started!'"
    depends_on:
      database:
        condition: service_started
